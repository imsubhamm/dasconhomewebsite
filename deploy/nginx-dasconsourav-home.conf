# Marketing site — isolate from ERP (dasconsouraverp.com).
# Install: /etc/nginx/sites-available/dasconsourav-home
# Enable:  ln -s ... /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Cert:    sudo certbot --nginx -d dasconsourav.com -d www.dasconsourav.com

server {
    listen 80;
    listen [::]:80;
    server_name dasconsourav.com www.dasconsourav.com;

    # Certbot will replace this with HTTPS redirect after certificate issue.
    root /var/www/dascon-home;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
